// build.gradle (Projet racine)
// PelletsFun Android Application
//
// Note : Les repositories sont configurés dans settings.gradle
// avec repositoriesMode FAIL_ON_PROJECT_REPOS.
// Ne pas déclarer de repositories ici (allprojects/buildscript).

plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.21' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
